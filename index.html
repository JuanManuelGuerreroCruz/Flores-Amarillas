<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flores amarillas</title>
<style>
  :root {
    --bg: #f5efe9;
    --text: #111;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
    color: var(--text);
  }

  .app {
    height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto;
  }

  .text {
    width: min(760px, 88vw);
    margin: 46px auto 0;
    font-size: clamp(18px, 2.15vw, 23px);
    line-height: 1.48;
    min-height: 120px;
    text-align: left;
    z-index: 2;
    font-family: "Segoe Print", "Comic Sans MS", "Trebuchet MS", sans-serif;
    font-style: normal;
    font-weight: 400;
    letter-spacing: 0.2px;
  }

  .canvas-wrap {
    position: relative;
    width: 100%;
    min-height: 0;
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  .counter {
    display: none;
  }

  #startScreen {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    z-index: 10;
    cursor: pointer;
    text-align: center;
    padding: 20px;
    overflow: hidden;
  }

  .start-card {
    display: inline-flex;
    align-items: center;
    gap: 20px;
    position: relative;
    transform-origin: center;
    transition: opacity 0.35s ease;
  }

  .start-flower-wrap {
    position: relative;
    width: 138px;
    height: 138px;
    flex: 0 0 auto;
    will-change: transform, left, top, opacity;
  }

  .start-flower {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
      radial-gradient(circle at center, #2c1209 0 18px, #4a2010 18px 28px, transparent 29px),
      radial-gradient(circle at center, rgba(255,255,255,0.22) 0 44px, transparent 45px);
    filter: drop-shadow(0 2px 3px rgba(105, 66, 20, 0.12));
  }

  .start-flower::before {
    content: "";
    position: absolute;
    inset: -14px;
    border-radius: 50%;
    background:
      conic-gradient(
        from 0deg,
        #eeb832 0deg 9deg, transparent 9deg 16deg,
        #f7cf55 16deg 25deg, transparent 25deg 32deg,
        #efbb36 32deg 41deg, transparent 41deg 48deg,
        #ffd967 48deg 57deg, transparent 57deg 64deg,
        #efbb36 64deg 73deg, transparent 73deg 80deg,
        #f7cf55 80deg 89deg, transparent 89deg 96deg,
        #eeb832 96deg 105deg, transparent 105deg 112deg,
        #ffd967 112deg 121deg, transparent 121deg 128deg,
        #efbb36 128deg 137deg, transparent 137deg 144deg,
        #f7cf55 144deg 153deg, transparent 153deg 160deg,
        #eeb832 160deg 169deg, transparent 169deg 176deg,
        #ffd967 176deg 185deg, transparent 185deg 192deg,
        #efbb36 192deg 201deg, transparent 201deg 208deg,
        #f7cf55 208deg 217deg, transparent 217deg 224deg,
        #eeb832 224deg 233deg, transparent 233deg 240deg,
        #ffd967 240deg 249deg, transparent 249deg 256deg,
        #efbb36 256deg 265deg, transparent 265deg 272deg,
        #f7cf55 272deg 281deg, transparent 281deg 288deg,
        #eeb832 288deg 297deg, transparent 297deg 304deg,
        #ffd967 304deg 313deg, transparent 313deg 320deg,
        #efbb36 320deg 329deg, transparent 329deg 336deg,
        #f7cf55 336deg 345deg, transparent 345deg 360deg
      );
    -webkit-mask: radial-gradient(circle at center, transparent 0 40px, #000 41px);
            mask: radial-gradient(circle at center, transparent 0 40px, #000 41px);
  }

  .start-flower::after {
    content: "";
    position: absolute;
    inset: 26px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 38% 38%, rgba(255, 214, 118, 0.22) 0 8px, transparent 9px),
      radial-gradient(circle at center, #2d1008 0 22px, #4e2311 22px 34px, #2f140b 34px 40px, transparent 41px);
  }

  .start-copy {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    color: #6b422b;
    will-change: opacity, transform;
  }

  .start-title {
    font-family: "Segoe Print", "Comic Sans MS", "Trebuchet MS", sans-serif;
    font-size: clamp(34px, 5.4vw, 58px);
    line-height: 1;
    font-weight: 400;
    letter-spacing: 0.4px;
  }

  .start-line {
    width: min(260px, 30vw);
    height: 3px;
    border-radius: 999px;
    background: #7c4d2e;
    transform-origin: left center;
  }

  #startScreen.ready .start-flower-wrap {
    animation: flowerHover 1.8s ease-in-out infinite;
  }

  #startScreen.launch .start-copy {
    opacity: 0;
    transform: translateX(10px);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }

  #startScreen.launch .start-line {
    transform: scaleX(0.7);
    transition: transform 0.25s ease;
  }

  .start-flower-wrap.fly {
    position: fixed;
    z-index: 12;
    transition:
      left 1.05s cubic-bezier(.22,.78,.18,1),
      top 1.05s cubic-bezier(.22,.78,.18,1),
      transform 1.05s cubic-bezier(.2,.75,.18,1),
      opacity 0.35s ease;
  }

  @keyframes flowerHover {
    0%,100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-6px) rotate(-2deg); }
  }
</style>
</head>
<body>

<div id="startScreen">
  <div class="start-card" id="startCard">
    <div class="start-flower-wrap" id="startFlowerWrap">
      <div class="start-flower" id="startFlower">
        <div class="sf-core"></div>
      </div>
    </div>
    <div class="start-copy" id="startCopy">
      <div class="start-title">Toca aquí</div>
      <div class="start-line"></div>
    </div>
  </div>
</div>

<div class="app">
  <div class="text" id="message"></div>
  <div class="canvas-wrap">
    <canvas id="c"></canvas>
  </div>
  <div class="counter" id="counter"></div>
</div>

  const c1 = 1.70158;
  const c3 = c1 + 1;
  return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
}

function rand(min, max) {
  return min + Math.random() * (max - min);
}

function heartPoint(t, r, jitter = 0.35) {
  const x = 16 * Math.pow(Math.sin(t), 3) * r + rand(-jitter, jitter);
  const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * r + rand(-jitter, jitter);
  return { x, y };
}

function buildBlooms() {
  blooms = [];

  function pushBloom(x, y, sizeMin, sizeMax, delayFactor = 1, forceVariant = null) {
    const vertical = 1 - ((y + 1.02) / 1.88);
    const delay = clamp(vertical * delayFactor + Math.abs(x) * 0.028 + rand(-0.006, 0.010), 0, 1);

    blooms.push({
      x: x + rand(-0.006, 0.006),
      y: y + rand(-0.006, 0.006),
      size: rand(sizeMin, sizeMax),
      delay,
      rotation: rand(0, Math.PI * 2),
      variant: forceVariant || (Math.random() < 0.84 ? 'sunflower' : 'mini'),
      px: 0,
      py: 0
    });
  }

  function lerpProfile(profile, y) {
    for (let i = 0; i < profile.length - 1; i++) {
      const a = profile[i];
      const b = profile[i + 1];
      if (y <= a[0] && y >= b[0]) {
        const t = (y - b[0]) / (a[0] - b[0]);
        return b[1] + (a[1] - b[1]) * t;
      }
    }
    return profile[profile.length - 1][1];
  }

  // Perfil manual más limpio para que sí se lean los dos lóbulos del corazón
  const widthProfile = [
    [ 0.86, 0.30], [ 0.78, 0.46], [ 0.70, 0.62], [ 0.62, 0.74],
    [ 0.54, 0.83], [ 0.46, 0.89], [ 0.38, 0.93], [ 0.30, 0.95],
    [ 0.22, 0.95], [ 0.14, 0.92], [ 0.06, 0.86], [-0.02, 0.79],
    [-0.10, 0.71], [-0.18, 0.63], [-0.26, 0.56], [-0.34, 0.49],
    [-0.42, 0.42], [-0.50, 0.36], [-0.58, 0.30], [-0.66, 0.24],
    [-0.74, 0.18], [-0.82, 0.12], [-0.90, 0.08], [-0.98, 0.04]
  ];

  // Hendidura superior más clara para marcar los lóbulos
  const notchProfile = [
    [ 0.86, 0.18], [ 0.78, 0.14], [ 0.70, 0.10], [ 0.62, 0.06],
    [ 0.54, 0.03], [ 0.46, 0.01], [-1.00, 0.00]
  ];

  for (let y = 0.86; y >= -0.98; y -= 0.082) {
    const halfW = lerpProfile(widthProfile, y);
    const notch = lerpProfile(notchProfile, y);
    const step = y > 0.48 ? 0.118 : (y < -0.48 ? 0.098 : 0.108);

    for (let x = -halfW; x <= halfW; x += step) {
      if (notch > 0 && Math.abs(x) < notch) continue;

      // Evita flores sueltas arriba en los extremos
      if (y > 0.76 && Math.abs(x) > halfW * 0.90) continue;

      pushBloom(x, y, 0.24, 0.33, 0.88);
    }

    // Contorno suave por fila
    pushBloom(-halfW, y, 0.26, 0.36, 0.80, 'sunflower');
    pushBloom( halfW, y, 0.26, 0.36, 0.80, 'sunflower');

    // Refuerzo ligero de los hombros, pero sin saturar
    if (y > 0.58) {
      pushBloom(-halfW * 0.78, y, 0.24, 0.32, 0.78);
      pushBloom( halfW * 0.78, y, 0.24, 0.32, 0.78);
    }
  }

  // Refuerzos de lóbulos, contenidos y simétricos
  const lobeAnchors = [
    [-0.68, 0.74], [-0.50, 0.82], [-0.30, 0.85], [-0.14, 0.80],
    [ 0.14, 0.80], [ 0.30, 0.85], [ 0.50, 0.82], [ 0.68, 0.74],
    [-0.82, 0.48], [0.82, 0.48]
  ];
  lobeAnchors.forEach(([x, y]) => pushBloom(x, y, 0.25, 0.34, 0.76, 'sunflower'));

  // Punta inferior más fina
  const tipAnchors = [
    [0.00, -1.00], [-0.05, -0.92], [0.05, -0.92], [-0.10, -0.84], [0.10, -0.84]
  ];
  tipAnchors.forEach(([x, y]) => pushBloom(x, y, 0.24, 0.32, 0.82, 'sunflower'));

  blooms.sort((a, b) => a.delay - b.delay);
}

function buildFallers() {
  fallers = [];
  const lowerBlooms = blooms.filter(b => b.y < -0.12);

  for (let i = 0; i < 10; i++) {
    const base = lowerBlooms[Math.floor(Math.random() * lowerBlooms.length)] || blooms[Math.floor(Math.random() * blooms.length)];
    fallers.push({
      refX: base.x,
      refY: base.y,
      size: rand(0.14, 0.22),
      rotation: rand(0, Math.PI * 2),
      spin: rand(-0.010, 0.010),
      swing: rand(8, 18),
      drift: rand(-8, 8),
      startDelay: rand(0.2, 2.2),
      cycle: rand(5.8, 8.2),
      alpha: rand(0.42, 0.70),
      variant: Math.random() < 0.78 ? 'mini' : 'sunflower'
    });
  }
}

function makeSprite(drawFn, size) {
  const can = document.createElement('canvas');
  can.width = size;
  can.height = size;
  const g = can.getContext('2d');
  drawFn(g, size);
  return can;
}

function createSprites() {
  const sunflower = makeSprite((g, s) => {
    const cx = s / 2;
    const cy = s / 2;
    const size = s * 0.11;

    g.translate(cx, cy);

    for (let i = 0; i < 16; i++) {
      const a = (Math.PI * 2 / 16) * i;
      const px = Math.cos(a) * size * 1.25;
      const py = Math.sin(a) * size * 1.25;

      g.save();
      g.translate(px, py);
      g.rotate(a);

      const grad = g.createLinearGradient(-size, 0, size, 0);
      grad.addColorStop(0, "#fff29c");
      grad.addColorStop(0.45, "#ffd84d");
      grad.addColorStop(1, "#f6c11d");

      g.beginPath();
      g.ellipse(0, 0, size * 1.10, size * 0.42, 0, 0, Math.PI * 2);
      g.fillStyle = grad;
      g.fill();
      g.restore();
    }

    g.beginPath();
    g.arc(0, 0, size * 1.0, 0, Math.PI * 2);
    g.fillStyle = "#4f2d18";
    g.fill();

    g.beginPath();
    g.arc(0, 0, size * 0.65, 0, Math.PI * 2);
    g.fillStyle = "#6f3d1d";
    g.fill();

    g.beginPath();
    g.arc(-size * 0.18, -size * 0.16, size * 0.25, 0, Math.PI * 2);
    g.fillStyle = "rgba(255,223,120,0.22)";
    g.fill();
  }, 140);

  const mini = makeSprite((g, s) => {
    const cx = s / 2;
    const cy = s / 2;
    const size = s * 0.16;

    g.translate(cx, cy);

    for (let i = 0; i < 6; i++) {
      const a = (Math.PI * 2 / 6) * i;
      const px = Math.cos(a) * size * 0.7;
      const py = Math.sin(a) * size * 0.7;

      g.beginPath();
      g.ellipse(px, py, size * 0.72, size * 0.30, a, 0, Math.PI * 2);
      g.fillStyle = i % 2 === 0 ? "#ffe873" : "#ffd031";
      g.fill();
    }

    g.beginPath();
    g.arc(0, 0, size * 0.34, 0, Math.PI * 2);
    g.fillStyle = "#6b3f22";
    g.fill();
  }, 100);

  sprites = { sunflower, mini };
}

function updateLayout() {
  const w = c.width;
  const h = c.height;

  const scale = Math.min(w / 720, h / 520) * 0.92;
  const treeW = trunkImg.width * scale;
  const treeH = trunkImg.height * scale;
  const treeX = (w - treeW) / 2;
  const treeY = h - treeH - 8;

  layout = {
    treeX,
    treeY,
    treeW,
    treeH,
    heartCX: treeX + treeW * 0.5,
    heartCY: treeY + treeH * 0.285,
    heartW: treeW * 1.16,
    heartH: treeH * 0.92
  };

  for (const bloom of blooms) {
    let px = layout.heartCX + bloom.x * (layout.heartW / 2);
    let py = layout.heartCY - bloom.y * (layout.heartH / 2);

    // marca la hendidura del centro arriba
    if (Math.abs(bloom.x) < 0.16 && bloom.y > 0.68) {
      const notch = Math.min(1, (bloom.y - 0.68) / 0.18);
      py += layout.heartH * 0.060 * notch;
    }

    // baja flores altas de los lóbulos para que no sobresalgan
    if (Math.abs(bloom.x) > 0.18 && bloom.y > 0.74) {
      const drop = Math.min(1, (bloom.y - 0.74) / 0.14);
      py += layout.heartH * 0.080 * drop;
    }

    // afina la punta inferior
    if (bloom.y < -0.70) {
      const t = Math.min(1, (-0.70 - bloom.y) / 0.30);
      px = layout.heartCX + (px - layout.heartCX) * (1 - 0.12 * t);
      py += layout.heartH * 0.022 * t;
    }

    bloom.px = px;
    bloom.py = py;
  }
}

function drawTree(progress) {
  const visibleHeight = layout.treeH * progress;
  if (visibleHeight <= 0) return;

  ctx.drawImage(
    trunkImg,
    0,
    trunkImg.height - trunkImg.height * progress,
    trunkImg.width,
    trunkImg.height * progress,
    layout.treeX,
    layout.treeY + (layout.treeH - visibleHeight),
    layout.treeW,
    visibleHeight
  );
}

function drawBloomSprite(sprite, x, y, scale, rotation, alpha) {
  const w = sprite.width * scale;
  const h = sprite.height * scale;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  ctx.rotate(rotation);
  ctx.drawImage(sprite, -w / 2, -h / 2, w, h);
  ctx.restore();
}

function drawBlooms(progress) {
  for (const bloom of blooms) {
    const local = (progress - bloom.delay) / 0.18;
    if (local <= 0) continue;

    const p = local >= 1 ? 1 : local;
    const alpha = easeOutCubic(p);
    const scale = (0.12 + easeOutBack(p) * 0.88) * bloom.size;

    drawBloomSprite(
      bloom.variant === 'sunflower' ? sprites.sunflower : sprites.mini,
      bloom.px,
      bloom.py,
      scale,
      bloom.rotation,
      alpha
    );
  }
}

function drawFallingFlowers(elapsed) {
  const start = CONFIG.trunkDuration + CONFIG.bloomDuration * 0.35;
  const tSec = Math.max(0, elapsed - start) / 1000;
  if (tSec <= 0) return;

  for (const f of fallers) {
    const active = tSec - f.startDelay;
    if (active <= 0) continue;

    const local = (active % f.cycle) / f.cycle;
    const baseX = layout.heartCX + f.refX * (layout.heartW / 2);
    const baseY = layout.heartCY - f.refY * (layout.heartH / 2) * 0.98;

    const x = baseX + Math.sin(local * Math.PI * 2 + f.startDelay) * f.swing + f.drift * local;
    const y = baseY + local * (c.height - baseY - 16);
    const fade = local < 0.10 ? local / 0.10 : (local > 0.88 ? (1 - local) / 0.12 : 1);

    drawBloomSprite(
      f.variant === 'sunflower' ? sprites.sunflower : sprites.mini,
      x,
      y,
      f.size,
      f.rotation + active * f.spin,
      f.alpha * fade
    );
  }
}

function drawScene(elapsed = 0) {
  if (!trunkImg.complete || !layout || !sprites) return;

  ctx.clearRect(0, 0, c.width, c.height);
  drawTree(trunkProgress);

  if (trunkProgress >= 1) {
    drawBlooms(bloomProgress);
    drawFallingFlowers(elapsed);
  }
}

function animateScene(ts) {
  if (!animationStartTime) animationStartTime = ts;

  const elapsed = ts - animationStartTime;
  trunkProgress = clamp(elapsed / CONFIG.trunkDuration, 0, 1);

  const bloomElapsed = Math.max(0, elapsed - CONFIG.trunkDuration + 60);
  bloomProgress = clamp(bloomElapsed / CONFIG.bloomDuration, 0, 1);

  drawScene(elapsed);
  animationFrameId = requestAnimationFrame(animateScene);
}

function resize() {
  c.width = c.clientWidth;
  c.height = c.clientHeight;
  updateLayout();
  drawScene(0);
}
window.addEventListener('resize', resize);

function typeText(text, el) {
  let i = 0;
  el.innerHTML = '';
  (function write() {
    if (i < text.length) {
      el.innerHTML += text[i] === '\n' ? '<br>' : text[i];
      i++;
      setTimeout(write, 18);
    }
  })();
}

function updateCounter() {
  // contador desactivado
}

buildBlooms();
buildFallers();
createSprites();

trunkImg.onload = () => {
  resize();
  document.getElementById('startScreen').classList.add('ready');
};

document.getElementById('startScreen').onclick = () => {
  const startScreen = document.getElementById('startScreen');
  const startFlowerWrap = document.getElementById('startFlowerWrap');
  const music = document.getElementById('bgMusic');

  startScreen.classList.remove('ready');
  startScreen.classList.add('launch');

  if (music) {
    music.volume = 0.28;
    music.muted = false;
    try { music.load(); } catch (e) {}
    const playPromise = music.play();
    if (playPromise && typeof playPromise.catch === 'function') {
      playPromise.catch((err) => {
        console.log('No se pudo reproducir el audio automáticamente:', err);
      });
    }
  }

  const flowerRect = startFlowerWrap.getBoundingClientRect();
  const canvasRect = c.getBoundingClientRect();

  const startLeft = flowerRect.left;
  const startTop = flowerRect.top;

  const targetLeft = canvasRect.left + (canvasRect.width / 2) - (flowerRect.width / 2);
  const targetTop = canvasRect.top + (canvasRect.height * 0.89) - (flowerRect.height / 2);

  startFlowerWrap.classList.add('fly');
  startFlowerWrap.style.left = startLeft + 'px';
  startFlowerWrap.style.top = startTop + 'px';
  startFlowerWrap.style.transform = 'translateY(-20px) scale(1.07)';

  // pequeño brinco
  requestAnimationFrame(() => {
    setTimeout(() => {
      startFlowerWrap.style.transform = 'translateY(0px) scale(0.98) rotate(-4deg)';
    }, 110);

    // caída hacia el inicio del tronco
    setTimeout(() => {
      startFlowerWrap.style.left = targetLeft + 'px';
      startFlowerWrap.style.top = targetTop + 'px';
      startFlowerWrap.style.transform = 'translateY(0px) scale(0.42) rotate(10deg)';
    }, 220);
  });

  setTimeout(() => {
    startFlowerWrap.style.opacity = '0';
  }, 980);

  setTimeout(() => {
    startScreen.style.display = 'none';
    typeText(CONFIG.message, document.getElementById('message'));

    if (animationFrameId) cancelAnimationFrame(animationFrameId);
    animationStartTime = null;
    trunkProgress = 0;
    bloomProgress = 0;
    drawScene(0);
    animationFrameId = requestAnimationFrame(animateScene);
  }, 1080);
};
</script>


<audio id="bgMusic" preload="auto" loop>
  <source src="Somebody To Love.mp3" type="audio/mpeg">
</audio>
